name: Bug Report
description: バグ報告やエラーなど
labels: [bug]
assignees: [mimikun]
body:
  - type: textarea
    attributes:
      label: 問題の再現手順
      description: どのように操作しましたか？
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: input
    attributes:
      label: 期待する挙動
      description: どのようにしてほしかったですか？
    validations:
      required: true
  - type: input
    attributes:
      label: 実際の挙動
      description: 実際には何が起きましたか？
    validations:
      required: true
  - type: textarea
    attributes:
      label: 詳細な説明など
    validations:
      required: false
  - type: textarea
    attributes:
      label: ソフトのバージョンなど
      description: |
        バグが別なソフトに関係している場合は、そのソフトのバージョンなどを記載してください
      placeholder: |
        Mastodon 3.5.3 (or Edge)
        Ruby 2.7.6 (or v3.1.2)
        Node.js 16.18.0

        Google Chrome 106.0.5249.119
        Firefox 105.0.3

        etc...
    validations:
      required: true
